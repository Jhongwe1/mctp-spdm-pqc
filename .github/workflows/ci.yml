name: CI

# What this pipeline is for
# -------------------------
# The job that matters is the one that turns RED when a tampered measurement
# stops being rejected. A table of results can be anything; a build that fails
# on the negative is why a table can be believed.
#
# As of 2026-09-12 that job exists and is called `rats`.
#
# The half that came first, inside `verify`, asserts that an IN-FLIGHT tamper is
# refused by the handshake — and, just as importantly, that the DEVICE-SIDE one
# is not, because a measurement changed before it is signed reaches a requester
# with every signature valid. That arm completes with no error of any kind, and
# no amount of SPDM catches it.
#
# `rats` is the other half: the same ten captures, compared against a COSE-signed
# reference value under a policy, with the clean ones required to PASS and the
# tampered ones required to FAIL. rats/out/expected.json says which is which and
# why, per arm, so the assertion is a specification rather than a snapshot of a
# previous run.
#
#   now      verify    harness/verify_repo.sh. It runs the appraisal too when
#                      `opa` is present, and says so loudly when it is not.
#                      The step count is NOT MAINTAINED HERE; it went stale
#                      twice in two days when it was.
#   now      rats      reference values -> policy -> verdict. The job that turns
#                      red when a tampered measurement stops being rejected
#   now      drills    every C drill compiles under -Werror + both sanitizers;
#                      the ones named in c-drills/DONE.txt are run
#   now      negative  the three advisory-class tests, every one of their
#                      declared defect variants, and the two runs that assert
#                      what AddressSanitizer does and does not see
#   weekly   upstream  the pins still name what they say, libspdm builds from
#                      the pinned commit and passes its own unit tests, and the
#                      three advisories have not been edited under us
#
# Why `upstream` is weekly and not on every push
# ----------------------------------------------
# It builds libspdm and a vendored OpenSSL, which is twenty minutes, and it
# talks to two external services. Neither cost buys protection for this
# repository's code: the thing it evidences is "I can build upstream and my
# pins still point where they say", and that is a fact that is weekly-true.
#
# Putting it on every push would make a pull request go red because somebody
# else force-pushed a tag, which trains people to ignore the badge — and a
# badge people ignore is worse than no badge. So it runs on a schedule and on
# demand, and the README says so rather than leaving a reader to assume every
# job guards every commit.
#
# What W10 added to `verify` rather than to a job of its own: the conformance
# work produced two analysis tools and three assertions, and all five belong
# beside the other checks that run in seconds against committed evidence. In
# particular `verify` now re-asserts, from the committed test.log files, that
# one byte changed in flight still moves exactly the assertion that reads it --
# and, from the committed capture, that the CHALLENGE_AUTH signatures DMTF's
# suite reports as bad still verify. The second is the strongest claim in
# docs/validator-report.md and the one most worth having a machine repeat.
#
# This comment used to enumerate what `verify` checks. It went stale twice in
# two days — 2026-08-31 found it naming four checks where the job ran twelve,
# 2026-09-01 found it naming ten where the job ran twenty-two — and the fix
# both times was to correct the list, which is the fix that guarantees a third
# time. So the list is gone. A summary of a script, kept beside the script, has
# no mechanism holding it to the script, and the only durable version of it is
# the script.
#
#     bash harness/verify_repo.sh          # the same checks, locally, in seconds
#
# The `verify` job shells out to that file rather than restating anything,
# for the same reason.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, 04:17 UTC. Not on the hour: GitHub queues scheduled runs and the
    # top of the hour is where everybody else's are.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, self-tests, provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install Open Policy Agent
        # ★ The version is read out of third_party/opa.pin, not written here.
        # Two copies of a download URL are two places for it to drift from the
        # pin, and CLAUDE.md's rule is that the pin is the single truth about
        # a version. The pin's own consumed-by= line already named this file.
        run: |
          url="$(awk -F= '/^url=/{print $2}' third_party/opa.pin)"
          test -n "$url" || { echo "third_party/opa.pin has no url="; exit 1; }
          curl -fsSL -o /tmp/opa "$url"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version

      - name: harness/verify_repo.sh
        run: bash harness/verify_repo.sh

  rats:
    name: a tampered measurement must be rejected
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Open Policy Agent
        # ★ The version is read out of third_party/opa.pin, not written here.
        # Two copies of a download URL are two places for it to drift from the
        # pin, and CLAUDE.md's rule is that the pin is the single truth about
        # a version. The pin's own consumed-by= line already named this file.
        run: |
          url="$(awk -F= '/^url=/{print $2}' third_party/opa.pin)"
          test -n "$url" || { echo "third_party/opa.pin has no url="; exit 1; }
          curl -fsSL -o /tmp/opa "$url"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version

      - name: The encoders, against RFC 8949's own vectors
        run: python3 rats/cose.py selftest

      - name: The policy, against every way of breaking it
        run: python3 rats/appraise.py selftest

      - name: Every arm of the capture matrix, against what it must produce
        run: python3 rats/appraise.py matrix --check

      # The step above runs ONE policy, so it cannot say what changed when the
      # secure-version-number rule was loosened on 2026-09-14 — a change that
      # did nothing at all would satisfy it. This runs four of the same arms
      # under the live policy and under a frozen copy of the one it replaced,
      # and requires exactly one verdict to have moved: the legitimately
      # upgraded device. The rollback stays refused and the arm whose
      # measurement was altered stays refused, which is what says the
      # integrity half was not relaxed along with the version half.
      - name: The version rule was loosened in one direction only
        run: bash rats/test_svn_policy.sh

      # The two assertions above are about documents. This one is about the
      # shell: a verifier whose only channel is stdout cannot be used in a
      # pipeline, and the tool this replaced — DMTF's CoRimTool.py verify —
      # prints "Signature verification failed" and exits 0. So the exit code
      # is asserted directly, in both directions, because a tool that always
      # exits 1 would satisfy half of this and be equally useless.
      - name: The verdict reaches the shell
        run: |
          run="bench/data/w5-tamper-20260910T092621Z"
          # errexit is on by default here, and a FAIL verdict is a non-zero
          # exit that must be READ rather than propagated. Turning it off for
          # exactly these two lines is the point of the step.
          set +e
          python3 rats/appraise.py appraise "$run/t0_clean.decode.txt" >/dev/null
          clean=$?
          python3 rats/appraise.py appraise "$run/t1_meas.decode.txt" >/dev/null
          tampered=$?
          set -e
          echo "clean exit=$clean   tampered exit=$tampered"
          test "$clean" -eq 0 || { echo "the untampered capture did not pass"; exit 1; }
          test "$tampered" -eq 1 || { echo "the TAMPERED capture did not fail"; exit 1; }

      - name: Report
        run: |
          {
            echo "### RATS appraisal"
            echo
            python3 rats/appraise.py matrix --out /tmp/rats-out | sed -n '1,20p'
          } >> "$GITHUB_STEP_SUMMARY"

  drills:
    name: c-drills (-Werror, ASan, UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile every drill
        working-directory: c-drills
        run: make

      - name: Run the drills marked complete
        working-directory: c-drills
        run: make test

      - name: Report progress
        working-directory: c-drills
        run: |
          total=$(ls d[0-9]*.c 2>/dev/null | wc -l)
          done_count=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' DONE.txt | wc -l)
          {
            echo "### C drills: ${done_count} of ${total} complete"
            echo
            echo "Unfinished drills still have to compile cleanly under \`-Werror\`;"
            echo "they are not executed and are not claimed as passing."
          } >> "$GITHUB_STEP_SUMMARY"

  negative:
    name: negative tests (-Werror, ASan, UBSan)
    runs-on: ubuntu-24.04
    # Separate from `drills` on purpose. They share a Makefile shape and a set
    # of flags, and they measure different things: c-drills measures the author
    # and negative/ measures the repository. A job that went red would need to
    # say which, and two jobs say it without anybody reading a log.
    steps:
      - uses: actions/checkout@v4

      - name: Compile every negative test
        working-directory: negative
        run: make

      - name: Run the ones marked complete
        working-directory: negative
        run: make test

      - name: Report progress
        working-directory: negative
        run: |
          total=$(ls test_*.c 2>/dev/null | wc -l)
          done_count=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' DONE.txt | wc -l)
          {
            echo "### Negative tests: ${done_count} of ${total} complete"
            echo
            if [ "${done_count}" -eq 0 ]; then
              echo "The skeletons compile under \`-Werror\` with both sanitizers,"
              echo "and **none of them is claimed as passing** — \`DONE.txt\` is"
              echo "what \`make test\` runs and it is empty."
            else
              # The counts are asked OF the files rather than written here, for
              # the reason the header comment gives about the step list.
              cases=0; defects=0
              for t in $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' DONE.txt); do
                cases=$((cases + $(./"$t" --list | grep -c '^case ')))
                defects=$((defects + $(./"$t" --defects)))
              done
              echo "${cases} cases and **${defects} defect variants**. Each"
              echo "defect is a deliberately wrong implementation that has to be"
              echo "caught by exactly the cases its own file predicted — no"
              echo "fewer, and no others."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  upstream:
    name: the pins still name what they say, and upstream still builds
    # Weekly and on demand only. The header comment says why: twenty minutes of
    # somebody else's build, protecting a claim that is weekly-true.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ★ Before the build, not after. A build that succeeds against a moved
      # pin has proved nothing about the pin, and the pin is the thing every
      # published number in this repository is attributed to.
      - name: The tags this project pins still point where the pins say
        # ★ Standing rule 20, which is the reason this is longer than it looks
        # like it needs to be: a lookup that did not happen is not a tag that
        # moved, and an empty `git ls-remote` is indistinguishable from both
        # unless something asks which it was. So the remote is listed ONCE,
        # that listing is required to be non-empty before anything is concluded
        # from it, and only then is each tag looked up inside it.
        #
        # Without that, one bad minute of DNS reports "the tag is now absent"
        # — and a weekly job that cries drift when the network hiccups is a
        # weekly job whose output nobody reads.
        #
        # The dereference is also not optional. These are LIGHTWEIGHT tags:
        # refs/tags/4.0.0-rc^{} does not exist for them and refs/tags/4.0.0-rc
        # is the commit. An annotated tag is the other way round. Asking for
        # both and preferring the dereferenced one is correct for either.
        run: |
          refs="$(git ls-remote --tags https://github.com/DMTF/libspdm.git)" || {
            echo "  could not list refs from DMTF/libspdm — the network, not a pin"
            exit 1
          }
          if [ -z "$refs" ]; then
            echo "  DMTF/libspdm reported no tags at all, which is not a drift"
            echo "  report: it is a broken lookup. Not concluding anything."
            exit 1
          fi
          echo "  listed $(printf '%s\n' "$refs" | wc -l) refs"

          fail=0
          for pin in third_party/spdm-emu-stable.pin third_party/spdm-emu-pqc.pin; do
            ref="$(awk -F= '/^libspdm-ref=/{print $2}' "$pin")"
            want="$(awk -F= '/^libspdm=/{print $2}' "$pin")"
            got="$(printf '%s\n' "$refs" | awk -v r="refs/tags/${ref}^{}" '$2==r{print $1}')"
            [ -n "$got" ] || got="$(printf '%s\n' "$refs" \
                                    | awk -v r="refs/tags/${ref}" '$2==r{print $1}')"
            if [ -z "$got" ]; then
              echo "  FAIL $pin: the tag $ref is GONE from a listing that returned"
              echo "       $(printf '%s\n' "$refs" | wc -l) other refs. The pin says $want"
              fail=1
            elif [ "$got" = "$want" ]; then
              echo "  ok   $pin: $ref is still $want"
            else
              echo "  FAIL $pin: $ref now resolves to $got, the pin says $want"
              fail=1
            fi
          done
          exit $fail

      - name: The three advisories have not been edited under their pins
        # Drift is news rather than a failure, so this does not gate the build.
        # What it must not do is go unnoticed, which is the whole reason it runs
        # somewhere rather than nowhere.
        run: python3 harness/check_advisories.py --refresh

      - name: Clone libspdm at the commit third_party/spdm-emu-pqc.pin names
        run: |
          sha="$(awk -F= '/^libspdm=/{print $2}' third_party/spdm-emu-pqc.pin)"
          git init --quiet /tmp/libspdm
          git -C /tmp/libspdm remote add origin https://github.com/DMTF/libspdm.git
          git -C /tmp/libspdm fetch --quiet --depth 1 origin "$sha"
          git -C /tmp/libspdm checkout --quiet FETCH_HEAD
          git -C /tmp/libspdm submodule update --init --depth 1 --recursive
          echo "HEAD=$(git -C /tmp/libspdm rev-parse HEAD)  pin=$sha"
          test "$(git -C /tmp/libspdm rev-parse HEAD)" = "$sha"

      - name: Build it, the way third_party/spdm-emu-pqc.pin says it was built
        working-directory: /tmp/libspdm
        run: |
          cmake -S . -B build -DARCH=x64 -DTOOLCHAIN=GCC -DTARGET=Release \
                -DCRYPTO=openssl
          cmake --build build -j"$(nproc)"

      - name: Its own unit tests
        working-directory: /tmp/libspdm/build
        run: |
          # Named individually rather than globbed. Standing rule 20: sixty-nine
          # fuzz targets live in the same directory and answer "file error" to
          # being run with no argument, which an earlier version of
          # harness/run_coverage.sh counted as six broken unit tests.
          for t in test_spdm_requester test_spdm_responder test_crypt; do
            if [ -x "bin/$t" ]; then
              echo "--- $t ---"
              "./bin/$t"
            else
              echo "--- $t is not in this build ---"
            fi
          done

      - name: Report
        if: always()
        run: |
          {
            echo "### Upstream"
            echo
            echo "Weekly. It answers three questions and none of them is about"
            echo "this repository's own code:"
            echo
            echo "1. do the tags \`third_party/*.pin\` name still resolve to the"
            echo "   commits the pins record"
            echo "2. does libspdm still build at that commit, with the flags the"
            echo "   pin says its captures were taken with"
            echo "3. have the three 2026 advisories been edited since they were"
            echo "   pinned"
            echo
            echo "1 and 2 are the precondition for sending anything upstream."
            echo "3 is the only thing in this pipeline that can change without"
            echo "anybody here touching a file."
          } >> "$GITHUB_STEP_SUMMARY"
