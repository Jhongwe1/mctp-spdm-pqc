<text x="44" y="91" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52606d" text-anchor="start">P2  ML-DSA-65 + ML-KEM-768</text>
<rect x="214" y="85" width="14" height="3" fill="#9ab5a4"/>
<text x="234" y="91" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52606d" text-anchor="start">A0  ECDSA P-384 + ECDHE P-384</text>
<text x="24" y="536" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">Across a 32x range of DataTransferSize the post-quantum handshake’s bytes move 3.1% and its chunk round trips move from 0 to 59.</text>
<text x="24" y="553" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">So DataTransferSize buys round trips and not bandwidth. Each round trip is one bus RTT, which on SMBus at 100 kHz is the expensive half of the cost.</text>
<text x="24" y="570" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">The classical arm chunks only at 1,024 bytes, where its 1,655-byte chain stops fitting - the dashed line.</text>
<text x="24" y="587" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">The 4,608-byte point reproduces the unpatched build’s capture exactly, which is what makes the other five comparable to it.</text>
<text x="24" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="normal" fill="#9aa5b1" text-anchor="start">DataTransferSize has no upstream flag; it is LIBSPDM_RECEIVER_BUFFER_SIZE minus transport overhead. transport/data-transfer-size.patch makes it settable.</text>
<text x="24" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="normal" fill="#9aa5b1" text-anchor="start">bench/data/w8-dts-sweep-20260929T142215Z · 12 arms · SPDM 1.4 in every arm · algorithms and DataTransferSize read back off the wire</text>
<text x="24" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="normal" fill="#9aa5b1" text-anchor="start">flavor pqc-dts (+ transport/data-transfer-size.patch) · spdm-emu 5f01d2f · libspdm 8a92317 (4.0.0-rc) · commands and hashes: manifest.json</text>
</svg>
