<line x1="24" y1="366" x2="876" y2="366" stroke="#9aa5b1" stroke-width="1"/>
<text x="24" y="386" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">Version-Capabilities-Algorithms is 152 SPDM bytes in every one of the six arms. Nothing post-quantum costs anything to negotiate.</text>
<text x="24" y="403" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">At matched NIST level 3 the bytes go x8.99 and the round trips x2.09; at level 5, x10.91 and x3.00.</text>
<text x="24" y="420" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">The certificate chain is 86% of the post-quantum arm and the MEASUREMENTS response 7%. This flow fetches the chain three times.</text>
<text x="24" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="normal" fill="#9aa5b1" text-anchor="start">orange is SPDM chunking, which costs a round trip per chunk · every number read from the capture</text>
<text x="24" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="normal" fill="#9aa5b1" text-anchor="start">bench/data/w8-pqc-matrix-20260914T131557Z · &lt;arm&gt;-all.pcap · SPDM 1.4 in every arm · algorithms read back from ALGORITHMS</text>
<text x="24" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="normal" fill="#9aa5b1" text-anchor="start">flavor pqc · spdm-emu 5f01d2f · libspdm 8a92317 (4.0.0-rc) · commands and hashes: manifest.json</text>
